<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mimono shikaku — square halftone playground</title>
  <style>
    :root {
      --base-gray: #f3f3f3;
      --play-red: #ff3110;
      --text-red: #c32308;
      --ink: #0d0d0d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', 'Helvetica', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--ink);
      color: var(--ink);
    }

    /* Shikaku means both square (四角) and visual (視覚): keep the stage 1:1. */
    .hero {
      position: relative;
      width: min(100vw, 100vh);
      aspect-ratio: 1;
      background: var(--base-gray);
      overflow: hidden;
    }
    .hero halftone-fx {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    /* Checkerboard shows through when the background is transparent */
    .hero.checker {
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #2e2e2e 0% 50%) 50% / 28px 28px;
    }
    .brand-lockup {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 11;
      display: grid;
      gap: 3px;
      padding: 11px 13px 10px;
      background: var(--play-red);
      color: var(--ink);
      line-height: 1;
    }
    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.055em;
    }
    .brand-concept {
      font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
      font-size: 9px;
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* Control panel */
    .panel {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(243, 243, 243, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ink);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px 12px;
      align-items: center;
      font-size: 12px;
      width: min(360px, calc(100vw - 32px));
    }
    .panel label { color: #444; }
    .panel input[type="range"] { width: 100%; accent-color: var(--play-red); }
    .panel input[type="checkbox"] { accent-color: var(--play-red); }
    .panel output { min-width: 34px; text-align: right; color: #222; font-variant-numeric: tabular-nums; }
    .panel select, .panel input[type="color"] {
      grid-column: 2 / 4;
      background: #fff; color: var(--ink); border: 1px solid var(--ink);
      border-radius: 0; padding: 4px 6px; width: 100%; height: 28px;
    }
    .panel .row-check { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; color: #444; }
    .panel .help-link {
      grid-column: 1 / 4; text-align: center; color: #555;
      text-decoration: none; padding: 2px;
    }
    .panel .help-link:hover { color: var(--text-red); }
    .panel .export-btn {
      grid-column: 1 / 4; padding: 9px; border: 1px solid var(--play-red); border-radius: 0;
      background: var(--play-red); color: var(--ink); font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .panel .export-btn:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
    .panel .embed-btn { background: var(--ink); border-color: var(--ink); color: #fff; }
    .panel .embed-btn:hover { background: var(--play-red); border-color: var(--play-red); color: var(--ink); }
    .panel .upload-btn {
      grid-column: 1 / 4; padding: 7px; border: 1px dashed var(--ink); border-radius: 0;
      background: transparent; color: #333; font-size: 12px; cursor: pointer;
    }
    .panel .upload-btn:hover { border-color: var(--play-red); color: var(--text-red); }
    .panel .upload-btn:disabled { cursor: wait; opacity: 0.6; }
    .panel .upload-btn.error { border-color: #a00; color: #a00; }
    @media (min-width: 601px) and (max-height: 520px) {
      .panel { max-height: calc(100vh - 32px); overflow-y: auto; }
      .brand-lockup { left: auto; right: 16px; }
    }
    @media (max-width: 600px) {
      body {
        display: block;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--base-gray);
      }
      .hero { width: 100vw; }
      .brand-lockup {
        position: absolute;
        top: 12px;
        left: 12px;
      }
      .panel {
        position: relative;
        inset: auto;
        width: 100%;
        max-height: none;
        overflow: visible;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
      }
    }
  </style>
</head>
<body>

  <section class="hero checker">
    <halftone-fx id="fx"
      src="./assets/mimono-circle.jpeg"
      grid="80"
      shape="square"
      threshold="50"
      mark-size="42"
      brightness="12"
      dot-color="#ff3110"
      background="transparent"></halftone-fx>
  </section>

  <div class="brand-lockup" aria-label="mimono shikaku">
    <span class="brand-name">mimono</span>
    <span class="brand-concept">shikaku / 四角・視覚</span>
  </div>

  <div class="panel">
    <label for="srcSelect">Source</label>
    <select id="srcSelect">
      <option value="./assets/mimono-circle.jpeg" selected>mimono-circle.jpeg</option>
      <option value="./assets/demo.mp4">demo.mp4</option>
      <option value="./assets/horse.mp4">horse.mp4</option>
    </select>

    <button class="upload-btn" id="uploadBtn" type="button">⬆️ Upload your own media</button>
    <input type="file" id="uploadInput" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,video/mp4,video/webm,video/quicktime" hidden>

    <label for="grid">Grid</label>
    <input type="range" id="grid" min="8" max="160" value="80">
    <output id="gridOut">80</output>

    <label for="markSize">Mark size</label>
    <input type="range" id="markSize" min="5" max="100" value="42">
    <output id="markSizeOut">42</output>

    <label for="brightness">Bright</label>
    <input type="range" id="brightness" min="-100" max="100" value="12">
    <output id="brightnessOut">12</output>

    <label for="threshold">Threshold</label>
    <input type="range" id="threshold" min="0" max="100" value="50">
    <output id="thresholdOut">50</output>

    <label for="contrast">Contrast</label>
    <input type="range" id="contrast" min="-100" max="100" value="0">
    <output id="contrastOut">0</output>

    <label for="gamma">Gamma</label>
    <input type="range" id="gamma" min="0.1" max="3" step="0.1" value="1">
    <output id="gammaOut">1</output>

    <label for="dither">Dither</label>
    <select id="dither">
      <option value="none" selected>None (pure halftone)</option>
      <option value="bayer4">Bayer 4&times;4 (retro)</option>
      <option value="bayer8">Bayer 8&times;8 (finer)</option>
      <option value="grain">Grain (blue-noise, stable)</option>
      <option value="noise">Noise (animated flicker)</option>
    </select>

    <label for="shape">Shape</label>
    <select id="shape">
      <option value="square" selected>Square / 四角</option>
      <option value="circle">Circle (legacy)</option>
    </select>

    <label for="dotColor">Marks</label>
    <input type="color" id="dotColor" value="#ff3110">

    <label for="bgColor">Background</label>
    <input type="color" id="bgColor" value="#f3f3f3" disabled>

    <div class="row-check">
      <input type="checkbox" id="transparentBg" checked>
      <label for="transparentBg">Transparent background (marks over your page)</label>
    </div>

    <div class="row-check">
      <input type="checkbox" id="multicolor">
      <label for="multicolor">Multicolor marks</label>
    </div>

    <button class="export-btn" id="downloadPng">⬇ Download PNG</button>
    <button class="export-btn embed-btn" id="exportIframe">📋 Export iframe (copy embed code)</button>

    <a class="help-link" href="./help.html">❓ Help — embedding, STUDIO, adding assets</a>
  </div>

  <script src="./halftone-fx.js"></script>
  <script>
    const fx = document.getElementById('fx');
    const bind = (id, attr) => {
      const el = document.getElementById(id);
      const out = document.getElementById(id + 'Out');
      el.addEventListener('input', () => {
        fx.setAttribute(attr, el.value);
        if (out) out.textContent = el.value;
      });
    };
    bind('grid', 'grid');
    bind('markSize', 'mark-size');
    bind('brightness', 'brightness');
    bind('threshold', 'threshold');
    bind('contrast', 'contrast');
    bind('gamma', 'gamma');
    bind('dither', 'dither');
    bind('shape', 'shape');
    bind('dotColor', 'dot-color');
    bind('bgColor', 'background');

    document.getElementById('multicolor').addEventListener('change', e => {
      e.target.checked ? fx.setAttribute('multicolor', '') : fx.removeAttribute('multicolor');
    });

    const bgColorInput = document.getElementById('bgColor');
    document.getElementById('transparentBg').addEventListener('change', e => {
      bgColorInput.disabled = e.target.checked;
      fx.setAttribute('background', e.target.checked ? 'transparent' : bgColorInput.value);
      document.querySelector('.hero').classList.toggle('checker', e.target.checked);
    });

    // Track what's playing so Export iframe can reference it by URL.
    let currentSrc = './assets/mimono-circle.jpeg';

    document.getElementById('srcSelect').addEventListener('change', e => {
      currentSrc = e.target.value;
      fx.removeAttribute('type');
      fx.setAttribute('src', currentSrc);
    });

    // Populate the Source dropdown from the repo's assets folder on GitHub,
    // so committing a new file there makes it appear here — no code changes.
    const ASSETS_API = 'https://api.github.com/repos/playbox-dev/halftone-dithering-fx/contents/webgl/assets';
    const MEDIA_RE = /\.(mp4|webm|ogv|mov|m4v|png|jpe?g|gif|webp|avif)$/i;
    (async () => {
      try {
        const r = await fetch(ASSETS_API, { headers: { Accept: 'application/vnd.github+json' } });
        if (!r.ok) return; // keep the built-in options
        const repoNames = (await r.json())
          .filter(f => f.type === 'file' && MEDIA_RE.test(f.name))
          .map(f => f.name);
        if (!repoNames.length) return;
        const sel = document.getElementById('srcSelect');
        // Preserve bundled options during the short GitHub API cache window after deploy.
        const bundledNames = [...sel.options]
          .filter(o => o.value.startsWith('./assets/'))
          .map(o => o.value.slice('./assets/'.length));
        const names = [...new Set([...bundledNames, ...repoNames])];
        names.sort((a, b) => {
          if (a === 'mimono-circle.jpeg') return -1;
          if (b === 'mimono-circle.jpeg') return 1;
          return a.localeCompare(b);
        });
        // Keep uploaded entries (absolute URLs) — repo-asset options are rebuilt.
        const uploaded = [...sel.options].filter(o => /^https?:/i.test(o.value));
        sel.innerHTML = '';
        for (const n of names) {
          const o = document.createElement('option');
          o.value = './assets/' + n;
          o.textContent = n;
          sel.appendChild(o);
        }
        for (const o of uploaded) sel.appendChild(o);
        if (/^https?:/i.test(currentSrc)) {
          sel.value = currentSrc;
        } else {
          const currentName = currentSrc.startsWith('./assets/')
            ? currentSrc.slice('./assets/'.length) : '';
          sel.value = currentName && names.includes(currentName)
            ? currentSrc
            : names.includes('mimono-circle.jpeg')
              ? './assets/mimono-circle.jpeg' : './assets/' + names[0];
          if (sel.value !== currentSrc) sel.dispatchEvent(new Event('change'));
        }
      } catch { /* offline — built-in options remain */ }
    })();

    // --- Upload your own media ---
    // Files go through a rate-limited Supabase Edge Function (max 50MB,
    // image/video only) and come back as a public URL, so exported embeds
    // work anywhere — not just with the repo's bundled assets.
    // The anon key is public by design; the function enforces all limits.
    const UPLOAD_ENDPOINT = 'https://kscnqkuxhelifwdwsvmp.supabase.co/functions/v1/halftone-upload';
    const UPLOAD_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzY25xa3V4aGVsaWZ3ZHdzdm1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTAzMzIsImV4cCI6MjA4NzIyNjMzMn0.qsmzoiMhF3S-9sqVNAZLSNPVSW8iq_Fa54GVrpG9yKY';
    const UPLOAD_MAX_BYTES = 50 * 1024 * 1024;

    const uploadBtn = document.getElementById('uploadBtn');
    const uploadInput = document.getElementById('uploadInput');
    const uploadIdle = uploadBtn.textContent;

    let uploadStatusTimer = 0;
    function uploadStatus(text, isError) {
      clearTimeout(uploadStatusTimer); // a stale reset must not clobber this status
      uploadBtn.textContent = text;
      uploadBtn.classList.toggle('error', !!isError);
      if (isError) uploadStatusTimer = setTimeout(() => {
        uploadBtn.textContent = uploadIdle;
        uploadBtn.classList.remove('error');
      }, 4000);
    }

    uploadBtn.addEventListener('click', () => uploadInput.click());
    uploadInput.addEventListener('change', async () => {
      const file = uploadInput.files[0];
      uploadInput.value = '';
      if (!file) return;
      if (file.size > UPLOAD_MAX_BYTES) return uploadStatus('✗ Over the 50MB limit', true);

      uploadBtn.disabled = true;
      uploadStatus('⏳ Uploading…');
      try {
        const r = await fetch(UPLOAD_ENDPOINT, {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + UPLOAD_ANON_KEY,
            'Content-Type': file.type || 'application/octet-stream',
          },
          body: file,
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || ('Upload failed (' + r.status + ')'));

        const sel = document.getElementById('srcSelect');
        const o = document.createElement('option');
        o.value = data.url;
        o.textContent = '⬆ ' + file.name;
        sel.appendChild(o);
        sel.value = data.url;
        sel.dispatchEvent(new Event('change'));
        uploadStatus(uploadIdle);
      } catch (err) {
        uploadStatus('✗ ' + err.message, true);
      } finally {
        uploadBtn.disabled = false;
      }
    });

    // --- Download PNG ---
    const downloadBtn = document.getElementById('downloadPng');
    downloadBtn.addEventListener('click', async () => {
      const label = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Rendering PNG…';
      try {
        const blob = await fx.snapshot();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'mimono-shikaku.png';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        downloadBtn.textContent = '✓ PNG downloaded';
      } catch (err) {
        console.error(err);
        downloadBtn.textContent = '✗ Download failed';
      } finally {
        downloadBtn.disabled = false;
        setTimeout(() => { downloadBtn.textContent = label; }, 2500);
      }
    });

    // --- Export iframe ---
    // Emits only params that differ from embed.html's defaults, so URLs stay short.
    const EMBED_DEFAULTS = { src: './assets/mimono-circle.jpeg', grid: '80', shape: 'square',
                             size: '42', threshold: '50', dot: 'ff3110', bg: 'transparent', brightness: '12',
                             contrast: '0', gamma: '1', dither: 'none' };
    const CANONICAL_EMBED = 'https://playbox-dev.github.io/halftone-dithering-fx/webgl/embed.html';

    function buildEmbedCode() {
      const local = /^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname);
      const base = local ? CANONICAL_EMBED : new URL('embed.html', location.href).href;
      const p = new URLSearchParams();
      if (currentSrc !== EMBED_DEFAULTS.src) p.set('src', currentSrc);
      const vals = {
        grid: document.getElementById('grid').value,
        shape: document.getElementById('shape').value,
        size: document.getElementById('markSize').value,
        threshold: document.getElementById('threshold').value,
        dot: document.getElementById('dotColor').value.slice(1),
        bg: document.getElementById('transparentBg').checked
          ? 'transparent' : document.getElementById('bgColor').value.slice(1),
        brightness: document.getElementById('brightness').value,
        contrast: document.getElementById('contrast').value,
        gamma: document.getElementById('gamma').value,
        dither: document.getElementById('dither').value,
      };
      for (const [k, v] of Object.entries(vals)) {
        if (v !== EMBED_DEFAULTS[k]) p.set(k, v);
      }
      if (document.getElementById('multicolor').checked) p.set('multicolor', '');
      const q = p.toString().replace(/=(?=&|$)/g, '').replace(/%2F/gi, '/');
      return `<iframe src="${base}${q ? '?' + q : ''}"\n` +
             `        style="width:100%;aspect-ratio:1/1;display:block;border:0;pointer-events:none"\n` +
             `        allow="autoplay" loading="lazy" title="mimono shikaku visual"></iframe>`;
    }

    const exportBtn = document.getElementById('exportIframe');
    exportBtn.addEventListener('click', async () => {
      const code = buildEmbedCode();
      window.__lastExport = code;
      const label = exportBtn.textContent;
      const done = '✓ Copied! Paste into your site builder';
      try {
        await navigator.clipboard.writeText(code);
        exportBtn.textContent = done;
      } catch {
        window.prompt('Copy the embed code:', code);
        exportBtn.textContent = done;
      }
      setTimeout(() => { exportBtn.textContent = label; }, 2500);
    });
  </script>
</body>
</html>
