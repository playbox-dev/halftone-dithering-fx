<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mimono halftone playground</title>
  <style>
    :root {
      --base-gray: #f3f3f3;
      --play-red: #ff3110;
      --text-red: #c32308;
      --ink: #0d0d0d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', 'Helvetica', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--ink);
      color: var(--ink);
    }

    /* Fit the current frame ratio inside the viewport without stretching it. */
    .hero {
      --frame-aspect: 1;
      position: relative;
      width: min(100vw, calc(100vh * var(--frame-aspect)));
      aspect-ratio: var(--frame-aspect);
      background: var(--base-gray);
      overflow: hidden;
    }
    .hero halftone-fx {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    /* Checkerboard shows through when the background is transparent */
    .hero.checker {
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #2e2e2e 0% 50%) 50% / 28px 28px;
    }
    .brand-lockup {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 11;
      display: grid;
      gap: 3px;
      padding: 11px 13px 10px;
      background: var(--play-red);
      color: var(--ink);
      line-height: 1;
    }
    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.055em;
    }
    .brand-concept {
      font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
      font-size: 9px;
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    /* Control panel */
    .panel {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(243, 243, 243, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ink);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px 12px;
      align-items: center;
      font-size: 12px;
      width: min(360px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .panel label { color: #444; }
    .panel input[type="range"] { width: 100%; accent-color: var(--play-red); }
    .panel input[type="checkbox"] { accent-color: var(--play-red); }
    .panel output { min-width: 34px; text-align: right; color: #222; font-variant-numeric: tabular-nums; }
    .panel select, .panel input[type="color"] {
      grid-column: 2 / 4;
      background: #fff; color: var(--ink); border: 1px solid var(--ink);
      border-radius: 0; padding: 4px 6px; width: 100%; height: 28px;
    }
    .panel .row-check { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; color: #444; }
    .panel .help-link {
      grid-column: 1 / 4; text-align: center; color: #555;
      text-decoration: none; padding: 2px;
    }
    .panel .help-link:hover { color: var(--text-red); }
    .panel .help-link[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
    .panel .export-btn {
      grid-column: 1 / 4; padding: 9px; border: 1px solid var(--play-red); border-radius: 0;
      background: var(--play-red); color: var(--ink); font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .panel .export-btn:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
    .panel .export-btn:disabled { cursor: not-allowed; opacity: 0.55; }
    .panel .export-btn:disabled:hover { background: var(--play-red); border-color: var(--play-red); color: var(--ink); }
    .panel .export-btn.cancel-btn { background: #fff; border-color: var(--ink); color: var(--ink); }
    .panel .export-status {
      grid-column: 1 / 4;
      min-height: 2.4em;
      color: #555;
      font-size: 12px;
      line-height: 1.35;
    }
    .panel .export-status.error { color: #a00; }
    .panel .export-progress {
      grid-column: 1 / 4;
      width: 100%;
      height: 4px;
      border: 0;
      accent-color: var(--play-red);
    }
    .panel .embed-btn { background: var(--ink); border-color: var(--ink); color: #fff; }
    .panel .embed-btn:hover { background: var(--play-red); border-color: var(--play-red); color: var(--ink); }
    .panel .upload-btn {
      grid-column: 1 / 4; padding: 7px; border: 1px dashed var(--ink); border-radius: 0;
      background: transparent; color: #333; font-size: 12px; cursor: pointer;
    }
    .panel .upload-btn:hover { border-color: var(--play-red); color: var(--text-red); }
    .panel .upload-btn:disabled { cursor: wait; opacity: 0.6; }
    .panel .upload-btn.error { border-color: #a00; color: #a00; }
    .panel input[type="range"]:disabled { opacity: 0.35; }
    @media (min-width: 601px) {
      .brand-lockup { left: auto; right: 16px; }
    }
    @media (max-width: 600px) {
      body {
        display: block;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--base-gray);
      }
      .hero { width: 100vw; }
      .brand-lockup {
        position: absolute;
        top: 12px;
        left: 12px;
      }
      .panel {
        position: relative;
        inset: auto;
        width: 100%;
        max-height: none;
        overflow: visible;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
      }
    }
  </style>
</head>
<body>

  <section class="hero checker">
    <halftone-fx id="fx"
      src="./assets/mimono-circle.png"
      grid="80"
      shape="square"
      threshold="50"
      mark-size="42"
      brightness="12"
      dot-color="#ff3110"
      background="transparent"></halftone-fx>
  </section>

  <div class="brand-lockup" aria-label="mimono">
    <span class="brand-name">mimono</span>
    <span class="brand-concept">square halftone</span>
  </div>

  <div class="panel">
    <label for="srcSelect">Source</label>
    <select id="srcSelect">
      <option value="./assets/mimono-circle.png" selected>mimono-circle.png</option>
      <option value="./assets/mimono-radial-gradient.png">mimono-radial-gradient.png</option>
      <option value="./assets/demo.mp4">demo.mp4</option>
      <option value="./assets/horse.mp4">horse.mp4</option>
    </select>

    <button class="upload-btn" id="uploadBtn" type="button">⬆️ Upload your own media</button>
    <input type="file" id="uploadInput" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,video/mp4,video/webm,video/quicktime" hidden>

    <label for="frame">Frame</label>
    <select id="frame">
      <option value="source" selected>Source ratio</option>
      <option value="square">Square crop</option>
    </select>

    <label for="preset">Look</label>
    <select id="preset">
      <option value="custom">Custom</option>
      <option value="sparse" selected>Sparse</option>
      <option value="detail">Detail</option>
      <option value="grain">Grain</option>
      <option value="bayer4">Bayer 4&times;4</option>
      <option value="bayer8">Bayer 8&times;8</option>
      <option value="poster">Poster</option>
      <option value="blocks">Blocks</option>
    </select>

    <label for="grid">Grid</label>
    <input type="range" id="grid" min="1" max="320" value="80">
    <output id="gridOut">80</output>

    <label for="markSize">Mark size</label>
    <input type="range" id="markSize" min="1" max="100" value="42">
    <output id="markSizeOut">42</output>

    <label for="brightness">Bright</label>
    <input type="range" id="brightness" min="-100" max="100" value="12">
    <output id="brightnessOut">12</output>

    <label for="threshold">Threshold</label>
    <input type="range" id="threshold" min="0" max="100" value="50">
    <output id="thresholdOut">50</output>

    <label for="contrast">Contrast</label>
    <input type="range" id="contrast" min="-100" max="100" value="0">
    <output id="contrastOut">0</output>

    <label for="gamma">Gamma</label>
    <input type="range" id="gamma" min="0.1" max="3" step="0.1" value="1">
    <output id="gammaOut">1</output>

    <label for="dither">Dither</label>
    <select id="dither">
      <option value="none" selected>None (pure halftone)</option>
      <option value="bayer4">Bayer 4&times;4 (retro)</option>
      <option value="bayer8">Bayer 8&times;8 (finer)</option>
      <option value="grain">Grain (blue-noise, stable)</option>
      <option value="noise">Noise (animated flicker)</option>
    </select>

    <label for="shape">Shape</label>
    <select id="shape">
      <option value="square" selected>Square</option>
      <option value="circle">Circle (legacy)</option>
    </select>

    <label for="dotColor">Marks</label>
    <input type="color" id="dotColor" value="#ff3110">

    <label for="bgColor">Background / matte</label>
    <input type="color" id="bgColor" value="#f3f3f3">

    <div class="row-check">
      <input type="checkbox" id="transparentBg" checked>
      <label for="transparentBg">Transparent background (marks over your page)</label>
    </div>

    <div class="row-check">
      <input type="checkbox" id="multicolor">
      <label for="multicolor">Multicolor marks</label>
    </div>

    <label for="motion">Motion</label>
    <select id="motion">
      <option value="off" selected>Off</option>
      <option value="pulse">Pulse</option>
      <option value="radial">Radial</option>
      <option value="sweep">Sweep</option>
      <option value="interference">Interference</option>
      <option value="scan">Scan</option>
    </select>

    <label for="amount">Amount</label>
    <input type="range" id="amount" min="0" max="100" value="35" disabled>
    <output id="amountOut">35</output>

    <label for="speed">Speed</label>
    <input type="range" id="speed" min="0" max="100" value="35" disabled>
    <output id="speedOut">35</output>

    <label for="exportFormat">Format</label>
    <select id="exportFormat">
      <option value="png" selected>PNG image</option>
      <option value="mp4">MP4 video</option>
      <option value="gif">Animated GIF</option>
    </select>

    <label for="exportDuration" id="exportDurationLabel" hidden>Length</label>
    <select id="exportDuration" hidden>
      <option value="3">3 seconds</option>
      <option value="6" selected>6 seconds</option>
      <option value="12">12 seconds</option>
    </select>

    <button class="export-btn" id="downloadMedia">⬇ Download PNG</button>
    <div class="export-status" id="exportStatus" role="status" aria-live="polite" aria-atomic="true">PNG keeps transparency. Video and GIF use #f3f3f3 behind transparent marks.</div>
    <progress class="export-progress" id="exportProgress" max="1" value="0" aria-label="Export progress" hidden></progress>
    <button class="export-btn embed-btn" id="exportIframe">📋 Export iframe (copy embed code)</button>

    <a class="help-link" href="./help.html">❓ Help — embedding, STUDIO, adding assets</a>
  </div>

  <script src="./halftone-fx.js?v=15"></script>
  <script src="./export-media.js?v=15"></script>
  <script>
    const fx = document.getElementById('fx');
    const hero = document.querySelector('.hero');
    const frameInput = document.getElementById('frame');
    const presetSelect = document.getElementById('preset');
    const motionInput = document.getElementById('motion');
    const amountInput = document.getElementById('amount');
    const speedInput = document.getElementById('speed');
    let applyingPreset = false;
    let sourceFrame = { width: 1, height: 1, aspectRatio: 1 };

    function applyFrame() {
      const sourceRatio = Number.isFinite(sourceFrame.aspectRatio) && sourceFrame.aspectRatio > 0
        ? sourceFrame.aspectRatio : 1;
      const ratio = frameInput.value === 'square' ? 1 : sourceRatio;
      hero.style.setProperty('--frame-aspect', String(ratio));
      fx.setAttribute('aspect', frameInput.value);
    }

    fx.addEventListener('source-ready', event => {
      const { width, height, aspectRatio } = event.detail || {};
      if (width > 0 && height > 0 && aspectRatio > 0) {
        sourceFrame = { width, height, aspectRatio };
        applyFrame();
      }
    });
    frameInput.addEventListener('change', applyFrame);
    applyFrame();

    function setMotion(mode) {
      const active = mode !== 'off';
      motionInput.value = mode;
      amountInput.disabled = !active;
      speedInput.disabled = !active;
      if (active) {
        fx.setAttribute('motion', mode);
        fx.setAttribute('amount', amountInput.value);
        fx.setAttribute('speed', speedInput.value);
      } else {
        fx.removeAttribute('motion');
      }
    }

    const bind = (id, attr) => {
      const el = document.getElementById(id);
      const out = document.getElementById(id + 'Out');
      el.addEventListener('input', () => {
        fx.setAttribute(attr, el.value);
        if (out) out.textContent = el.value;
        if (!applyingPreset) {
          presetSelect.value = 'custom';
        }
      });
    };
    bind('grid', 'grid');
    bind('markSize', 'mark-size');
    bind('brightness', 'brightness');
    bind('threshold', 'threshold');
    bind('contrast', 'contrast');
    bind('gamma', 'gamma');
    bind('dither', 'dither');
    bind('shape', 'shape');
    bind('dotColor', 'dot-color');

    const PRESETS = {
      sparse: { grid: 80, markSize: 42,  brightness: 12, threshold: 50, contrast: 0,  gamma: 1,   dither: 'none',   shape: 'square', multicolor: false },
      detail: { grid: 3,  markSize: 78,  brightness: 0,  threshold: 0,  contrast: 10, gamma: 1,   dither: 'none',   shape: 'square', multicolor: false },
      grain:  { grid: 3,  markSize: 55,  brightness: 20, threshold: 0,  contrast: 15, gamma: 1,   dither: 'grain',  shape: 'square', multicolor: false },
      bayer4: { grid: 6,  markSize: 82,  brightness: 6,  threshold: 0,  contrast: 38, gamma: 0.9, dither: 'bayer4', shape: 'square', multicolor: false },
      bayer8: { grid: 4,  markSize: 86,  brightness: 2,  threshold: 0,  contrast: 46, gamma: 0.9, dither: 'bayer8', shape: 'square', multicolor: false },
      poster: { grid: 8,  markSize: 100, brightness: -5, threshold: 24, contrast: 65, gamma: 0.8, dither: 'none',   shape: 'square', multicolor: false },
      blocks: { grid: 28, markSize: 92,  brightness: 0,  threshold: 12, contrast: 34, gamma: 0.9, dither: 'none',   shape: 'square', multicolor: false },
    };
    presetSelect.addEventListener('change', () => {
      const values = PRESETS[presetSelect.value];
      if (!values) return;
      applyingPreset = true;
      for (const [id, value] of Object.entries(values)) {
        if (id === 'multicolor') {
          const input = document.getElementById('multicolor');
          input.checked = value;
          input.dispatchEvent(new Event('change', { bubbles: true }));
          continue;
        }
        const el = document.getElementById(id);
        el.value = value;
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
      applyingPreset = false;
    });

    document.getElementById('multicolor').addEventListener('change', e => {
      e.target.checked ? fx.setAttribute('multicolor', '') : fx.removeAttribute('multicolor');
      if (!applyingPreset) presetSelect.value = 'custom';
    });

    motionInput.addEventListener('change', () => setMotion(motionInput.value));
    amountInput.addEventListener('input', () => {
      document.getElementById('amountOut').textContent = amountInput.value;
      fx.setAttribute('amount', amountInput.value);
    });
    speedInput.addEventListener('input', () => {
      document.getElementById('speedOut').textContent = speedInput.value;
      fx.setAttribute('speed', speedInput.value);
    });

    const bgColorInput = document.getElementById('bgColor');
    bgColorInput.addEventListener('input', () => {
      if (!document.getElementById('transparentBg').checked) {
        fx.setAttribute('background', bgColorInput.value);
      }
    });
    document.getElementById('transparentBg').addEventListener('change', e => {
      fx.setAttribute('background', e.target.checked ? 'transparent' : bgColorInput.value);
      document.querySelector('.hero').classList.toggle('checker', e.target.checked);
    });

    // Track what's playing so Export iframe can reference it by URL.
    let currentSrc = './assets/mimono-circle.png';

    document.getElementById('srcSelect').addEventListener('change', e => {
      currentSrc = e.target.value;
      fx.removeAttribute('type');
      fx.setAttribute('src', currentSrc);
    });

    // Populate the Source dropdown from the repo's assets folder on GitHub,
    // so committing a new file there makes it appear here — no code changes.
    const ASSETS_API = 'https://api.github.com/repos/playbox-dev/halftone-dithering-fx/contents/webgl/assets?ref=main';
    const MEDIA_RE = /\.(mp4|webm|ogv|mov|m4v|png|jpe?g|gif|webp|avif)$/i;
    (async () => {
      try {
        const r = await fetch(ASSETS_API, { headers: { Accept: 'application/vnd.github+json' } });
        if (!r.ok) return; // keep the built-in options
        const repoNames = (await r.json())
          .filter(f => f.type === 'file' && MEDIA_RE.test(f.name))
          .map(f => f.name);
        if (!repoNames.length) return;
        const sel = document.getElementById('srcSelect');
        // Preserve bundled options during the short GitHub API cache window after deploy.
        const bundledNames = [...sel.options]
          .filter(o => o.value.startsWith('./assets/'))
          .map(o => o.value.slice('./assets/'.length));
        const names = [...new Set([...bundledNames, ...repoNames])];
        names.sort((a, b) => {
          if (a === 'mimono-circle.png') return -1;
          if (b === 'mimono-circle.png') return 1;
          return a.localeCompare(b);
        });
        // Keep uploaded entries (absolute URLs) — repo-asset options are rebuilt.
        const uploaded = [...sel.options].filter(o => /^https?:/i.test(o.value));
        sel.innerHTML = '';
        for (const n of names) {
          const o = document.createElement('option');
          o.value = './assets/' + n;
          o.textContent = n;
          sel.appendChild(o);
        }
        for (const o of uploaded) sel.appendChild(o);
        if (/^https?:/i.test(currentSrc)) {
          sel.value = currentSrc;
        } else {
          const currentName = currentSrc.startsWith('./assets/')
            ? currentSrc.slice('./assets/'.length) : '';
          sel.value = currentName && names.includes(currentName)
            ? currentSrc
            : names.includes('mimono-circle.png')
              ? './assets/mimono-circle.png' : './assets/' + names[0];
          if (sel.value !== currentSrc) sel.dispatchEvent(new Event('change'));
        }
      } catch { /* offline — built-in options remain */ }
    })();

    // --- Upload your own media ---
    // Files go through a rate-limited Supabase Edge Function (max 50MB,
    // image/video only) and come back as a public URL, so exported embeds
    // work anywhere — not just with the repo's bundled assets.
    // The anon key is public by design; the function enforces all limits.
    const UPLOAD_ENDPOINT = 'https://kscnqkuxhelifwdwsvmp.supabase.co/functions/v1/halftone-upload';
    const UPLOAD_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzY25xa3V4aGVsaWZ3ZHdzdm1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTAzMzIsImV4cCI6MjA4NzIyNjMzMn0.qsmzoiMhF3S-9sqVNAZLSNPVSW8iq_Fa54GVrpG9yKY';
    const UPLOAD_MAX_BYTES = 50 * 1024 * 1024;

    const uploadBtn = document.getElementById('uploadBtn');
    const uploadInput = document.getElementById('uploadInput');
    const uploadIdle = uploadBtn.textContent;
    let uploadInProgress = false;

    let uploadStatusTimer = 0;
    function uploadStatus(text, isError) {
      clearTimeout(uploadStatusTimer); // a stale reset must not clobber this status
      uploadBtn.textContent = text;
      uploadBtn.classList.toggle('error', !!isError);
      if (isError) uploadStatusTimer = setTimeout(() => {
        uploadBtn.textContent = uploadIdle;
        uploadBtn.classList.remove('error');
      }, 4000);
    }

    uploadBtn.addEventListener('click', () => uploadInput.click());
    uploadInput.addEventListener('change', async () => {
      const file = uploadInput.files[0];
      uploadInput.value = '';
      if (!file) return;
      if (file.size > UPLOAD_MAX_BYTES) return uploadStatus('✗ Over the 50MB limit', true);

      uploadInProgress = true;
      uploadBtn.disabled = true;
      downloadBtn.disabled = true;
      uploadStatus('⏳ Uploading…');
      try {
        const r = await fetch(UPLOAD_ENDPOINT, {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + UPLOAD_ANON_KEY,
            'Content-Type': file.type || 'application/octet-stream',
          },
          body: file,
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || ('Upload failed (' + r.status + ')'));

        const sel = document.getElementById('srcSelect');
        const o = document.createElement('option');
        o.value = data.url;
        o.textContent = '⬆ ' + file.name;
        sel.appendChild(o);
        sel.value = data.url;
        sel.dispatchEvent(new Event('change'));
        uploadStatus(uploadIdle);
      } catch (err) {
        uploadStatus('✗ ' + err.message, true);
      } finally {
        uploadInProgress = false;
        uploadBtn.disabled = false;
        if (!activeExport) downloadBtn.disabled = false;
      }
    });

    // --- Download PNG / MP4 / WebM / GIF ---
    const panel = document.querySelector('.panel');
    const exportFormat = document.getElementById('exportFormat');
    const exportDuration = document.getElementById('exportDuration');
    const exportDurationLabel = document.getElementById('exportDurationLabel');
    const exportStatus = document.getElementById('exportStatus');
    const exportProgress = document.getElementById('exportProgress');
    const downloadBtn = document.getElementById('downloadMedia');
    const helpLink = panel.querySelector('.help-link');
    const transparentBgInput = document.getElementById('transparentBg');
    const mediaExporter = new MimonoMediaExporter(fx, {
      getMatte: () => bgColorInput.value,
    });
    const capabilities = MimonoMediaExporter.capabilities();
    let activeExport = null;
    let disabledBeforeExport = null;
    let helpLinkTabIndex = null;
    let exportStatusTimer = 0;
    let lastProgressAnnouncement = '';

    const mp4Option = exportFormat.querySelector('option[value="mp4"]');
    const gifOption = exportFormat.querySelector('option[value="gif"]');
    if (!capabilities.mp4) {
      mp4Option.disabled = true;
      mp4Option.textContent = 'MP4 — unavailable in this browser';
    }
    if (capabilities.webm) {
      const webmOption = document.createElement('option');
      webmOption.value = 'webm';
      webmOption.textContent = 'WebM video';
      mp4Option.after(webmOption);
    }
    gifOption.disabled = true;
    gifOption.textContent = capabilities.gif ? 'GIF — checking support…' : 'GIF — unavailable in this browser';
    if (capabilities.gif) MimonoMediaExporter.gifSupported().then(supported => {
      gifOption.disabled = !supported;
      gifOption.textContent = supported ? 'Animated GIF' : 'GIF — unavailable in this browser';
    });

    function formatName(format = exportFormat.value) {
      return { png: 'PNG', mp4: 'MP4', webm: 'WebM', gif: 'GIF' }[format] || format.toUpperCase();
    }

    function defaultExportStatus() {
      const format = exportFormat.value;
      if (format === 'png') {
        return transparentBgInput.checked
          ? 'PNG keeps transparency.'
          : 'PNG includes the selected background.';
      }
      if (transparentBgInput.checked) {
        return `${formatName()} uses ${bgColorInput.value.toUpperCase()} behind transparent marks. Exports are silent.`;
      }
      return `${formatName()} uses the selected background. Exports are silent.`;
    }

    function setExportStatus(message, isError = false) {
      clearTimeout(exportStatusTimer);
      exportStatus.textContent = message;
      exportStatus.classList.toggle('error', isError);
    }

    function updateExportUi(resetStatus = true) {
      const format = exportFormat.value;
      const animated = format !== 'png';
      exportDuration.hidden = !animated;
      exportDurationLabel.hidden = !animated;
      const longOption = exportDuration.querySelector('option[value="12"]');
      longOption.disabled = format === 'gif';
      if (format === 'gif' && exportDuration.value === '12') exportDuration.value = '6';
      if (!activeExport) downloadBtn.textContent = `⬇ Download ${formatName(format)}`;
      if (!activeExport) exportProgress.hidden = true;
      if (resetStatus) setExportStatus(defaultExportStatus());
    }

    function setExportBusy(busy) {
      const controls = [...panel.querySelectorAll('button, input, select')];
      if (busy) {
        disabledBeforeExport = new Map(controls.map(control => [control, control.disabled]));
        controls.forEach(control => { control.disabled = true; });
        downloadBtn.disabled = false;
        downloadBtn.classList.add('cancel-btn');
        downloadBtn.textContent = 'Cancel export';
        helpLinkTabIndex = helpLink.getAttribute('tabindex');
        helpLink.setAttribute('aria-disabled', 'true');
        helpLink.setAttribute('tabindex', '-1');
        lastProgressAnnouncement = '';
        return;
      }
      if (disabledBeforeExport) {
        for (const [control, disabled] of disabledBeforeExport) control.disabled = disabled;
      }
      disabledBeforeExport = null;
      downloadBtn.classList.remove('cancel-btn');
      helpLink.removeAttribute('aria-disabled');
      if (helpLinkTabIndex === null) helpLink.removeAttribute('tabindex');
      else helpLink.setAttribute('tabindex', helpLinkTabIndex);
      helpLinkTabIndex = null;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function showProgress(progress) {
      let announcement = '';
      if (progress.stage === 'rendering') {
        exportProgress.hidden = true;
        announcement = 'Rendering PNG…';
      } else if (progress.stage === 'recording') {
        exportProgress.hidden = false;
        exportProgress.max = progress.duration;
        exportProgress.value = progress.elapsed;
        const elapsed = Math.min(progress.duration, Math.floor(progress.elapsed));
        announcement = `Recording ${formatName(progress.format)}… ${elapsed} / ${progress.duration} s`;
      } else if (progress.stage === 'finalizing') {
        exportProgress.hidden = false;
        exportProgress.removeAttribute('value');
        announcement = `Finalizing ${formatName(progress.format)}…`;
      } else if (progress.stage === 'capturing') {
        exportProgress.hidden = false;
        exportProgress.max = progress.total;
        exportProgress.value = progress.current;
        const percent = Math.floor(progress.current / progress.total * 10) * 10;
        announcement = `Capturing GIF frames… ${percent}%`;
      } else if (progress.stage === 'encoding') {
        exportProgress.hidden = false;
        exportProgress.max = progress.total;
        exportProgress.value = progress.current;
        const percent = Math.floor(progress.current / progress.total * 10) * 10;
        announcement = `Encoding GIF… ${percent}%`;
      }
      if (announcement && announcement !== lastProgressAnnouncement) {
        lastProgressAnnouncement = announcement;
        setExportStatus(announcement);
      }
    }

    exportFormat.addEventListener('change', updateExportUi);
    bgColorInput.addEventListener('input', () => {
      if (!activeExport) setExportStatus(defaultExportStatus());
    });
    transparentBgInput.addEventListener('change', () => {
      if (!activeExport) setExportStatus(defaultExportStatus());
    });
    helpLink.addEventListener('click', event => {
      if (activeExport) event.preventDefault();
    });

    downloadBtn.addEventListener('click', async () => {
      if (activeExport) {
        activeExport.abort();
        downloadBtn.disabled = true;
        downloadBtn.textContent = 'Cancelling…';
        setExportStatus('Cancelling export…');
        return;
      }
      if (uploadInProgress) {
        setExportStatus('Wait for the upload to finish before exporting.');
        return;
      }

      const format = exportFormat.value;
      const duration = Number(exportDuration.value);
      const controller = new AbortController();
      activeExport = controller;
      setExportBusy(true);
      let exportHadError = false;

      try {
        const result = await mediaExporter.export(format, {
          duration,
          signal: controller.signal,
          onProgress: showProgress,
        });
        const filename = `mimono-halftone.${result.extension}`;
        window.__lastMediaExport = {
          format,
          filename,
          mimeType: result.mimeType,
          size: result.blob.size,
        };
        downloadBlob(result.blob, filename);
        setExportStatus(`${formatName(format)} downloaded`);
      } catch (error) {
        if (error?.name === 'AbortError') {
          setExportStatus('Export cancelled');
        } else {
          exportHadError = true;
          console.error(error);
          setExportStatus(error?.message || 'Export failed', true);
        }
      } finally {
        if (activeExport === controller) activeExport = null;
        setExportBusy(false);
        updateExportUi(false);
        if (!exportHadError) {
          exportStatusTimer = setTimeout(() => {
            if (!activeExport) setExportStatus(defaultExportStatus());
          }, 4000);
        }
      }
    });

    window.addEventListener('pagehide', () => activeExport?.abort());

    updateExportUi();

    // --- Export iframe ---
    // Emits only params that differ from embed.html's defaults, so URLs stay short.
    const EMBED_DEFAULTS = { src: './assets/mimono-circle.png', grid: '80', shape: 'square',
                             size: '42', threshold: '50', dot: 'ff3110', bg: 'transparent', brightness: '12',
                             contrast: '0', gamma: '1', dither: 'none' };
    const CANONICAL_EMBED = 'https://playbox-dev.github.io/halftone-dithering-fx/webgl/embed.html';

    function buildEmbedCode() {
      const local = /^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname);
      const base = local ? CANONICAL_EMBED : new URL('embed.html', location.href).href;
      const p = new URLSearchParams();
      p.set('aspect', frameInput.value);
      if (currentSrc !== EMBED_DEFAULTS.src) p.set('src', currentSrc);
      const vals = {
        grid: document.getElementById('grid').value,
        shape: document.getElementById('shape').value,
        size: document.getElementById('markSize').value,
        threshold: document.getElementById('threshold').value,
        dot: document.getElementById('dotColor').value.slice(1),
        bg: document.getElementById('transparentBg').checked
          ? 'transparent' : document.getElementById('bgColor').value.slice(1),
        brightness: document.getElementById('brightness').value,
        contrast: document.getElementById('contrast').value,
        gamma: document.getElementById('gamma').value,
        dither: document.getElementById('dither').value,
      };
      for (const [k, v] of Object.entries(vals)) {
        if (v !== EMBED_DEFAULTS[k]) p.set(k, v);
      }
      if (document.getElementById('multicolor').checked) p.set('multicolor', '');
      if (motionInput.value !== 'off') {
        p.set('motion', motionInput.value);
        p.set('amount', amountInput.value);
        p.set('speed', speedInput.value);
        p.set('phase', fx.motionPhase.toFixed(4));
      }
      const q = p.toString().replace(/=(?=&|$)/g, '').replace(/%2F/gi, '/');
      const frameAspect = frameInput.value === 'square'
        ? '1/1'
        : `${sourceFrame.width || 1}/${sourceFrame.height || 1}`;
      return `<iframe src="${base}${q ? '?' + q : ''}"\n` +
             `        style="width:100%;aspect-ratio:${frameAspect};display:block;border:0;pointer-events:none"\n` +
             `        allow="autoplay" loading="lazy" title="mimono halftone visual"></iframe>`;
    }

    const exportBtn = document.getElementById('exportIframe');
    exportBtn.addEventListener('click', async () => {
      const label = exportBtn.textContent;
      const done = '✓ Copied! Paste into your site builder';
      let code = '';
      try {
        exportBtn.textContent = 'Preparing embed…';
        await fx.whenReady();
        const dimensions = fx.sourceDimensions;
        if (dimensions.width > 0 && dimensions.height > 0) sourceFrame = dimensions;
        code = buildEmbedCode();
        window.__lastExport = code;
        exportBtn.dataset.lastExport = code;
        await navigator.clipboard.writeText(code);
        exportBtn.textContent = done;
      } catch (error) {
        if (code) {
          window.prompt('Copy the embed code:', code);
          exportBtn.textContent = done;
        } else {
          console.error(error);
          exportBtn.textContent = '✗ Embed export failed';
        }
      }
      setTimeout(() => { exportBtn.textContent = label; }, 2500);
    });
  </script>
</body>
</html>
