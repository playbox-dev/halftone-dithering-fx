<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mimono halftone embed</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    halftone-fx { width: min(100vw, 100vh); aspect-ratio: 1; }
  </style>
</head>
<body>
  <script src="./halftone-fx.js"></script>
  <script>
    // Configure entirely via query params, e.g.:
    //   embed.html?grid=80&shape=square&size=42&threshold=50&dot=ff3110&bg=transparent
    //   embed.html?src=https://your.cdn/clip.mp4&type=video&overdrive=1&flux=7&seed=42
    // Colors may omit the '#' (it can't appear raw in a URL).
    const p = new URLSearchParams(location.search);
    const fx = document.createElement('halftone-fx');

    // Aliases included (bg/background, dot/dotcolor/dot-color) so hand-written
    // URLs can't silently miss.
    const ATTRS = {
      src: 'src', type: 'type', grid: 'grid', shape: 'shape', threshold: 'threshold',
      size: 'mark-size', marksize: 'mark-size', 'mark-size': 'mark-size',
      dot: 'dot-color', dotcolor: 'dot-color', 'dot-color': 'dot-color',
      bg: 'background', background: 'background',
      brightness: 'brightness', contrast: 'contrast', gamma: 'gamma', dither: 'dither',
      flux: 'flux', seed: 'seed',
    };
    for (const [param, attr] of Object.entries(ATTRS)) {
      if (p.has(param)) fx.setAttribute(attr, p.get(param));
    }
    if (p.has('multicolor')) fx.setAttribute('multicolor', '');
    if (p.has('overdrive') && p.get('overdrive') !== '0') fx.setAttribute('overdrive', '');

    // Defaults: self-hosted circle artwork rendered with square marks.
    if (!fx.hasAttribute('src')) fx.setAttribute('src', './assets/mimono-circle.png');
    if (!fx.hasAttribute('grid')) fx.setAttribute('grid', '80');
    if (!fx.hasAttribute('shape')) fx.setAttribute('shape', 'square');
    if (!fx.hasAttribute('threshold')) fx.setAttribute('threshold', '50');
    if (!fx.hasAttribute('mark-size')) fx.setAttribute('mark-size', '42');
    if (!fx.hasAttribute('dot-color')) fx.setAttribute('dot-color', '#ff3110');
    if (!fx.hasAttribute('background')) fx.setAttribute('background', 'transparent');
    if (!fx.hasAttribute('brightness')) fx.setAttribute('brightness', '12');

    document.body.appendChild(fx);
  </script>
</body>
</html>
