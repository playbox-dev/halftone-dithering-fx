<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>playbox ビジュアル</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #poster,halftone-fx{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh * 16 / 9));height:max(100vh,calc(100vw * 9 / 16));transform:translate(-50%,-50%);pointer-events:none}
    #poster{object-fit:cover}
    halftone-fx{opacity:0}
    html[data-animation-ready] halftone-fx{opacity:1}
  </style>
</head>
<body>
  <img id="poster" src="./assets/playbox-hero/poster.webp" width="1440" height="810" alt="" fetchpriority="high" decoding="async">
  <script type="module" src="./playbox-hero.mjs?v=2"></script>
</body>
</html>
